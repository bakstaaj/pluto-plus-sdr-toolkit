# Pluto+ FM broadcast scan session
# Assumes Pluto+ RX coverage down to at least 70 MHz.

band = fm
out_prefix = fm

cycles = 5

scan_threshold_db = 10
activity_threshold_db = 10

scan_avg = 4
activity_avg = 4

# FM broadcast signals are wide. Use a wider activity passband.
passband_hz = 200000

gain_mode = slow_attack

summary_sort = activity
min_active_hits = 0

report = true
report_title = "Pluto+ FM Broadcast Activity Report"
report_max_rows = 500
